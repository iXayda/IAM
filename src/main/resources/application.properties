spring.application.name=iam
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.table-name=iam_browser_session
server.forward-headers-strategy=NONE
server.tomcat.remoteip.host-header=
server.tomcat.remoteip.port-header=
server.tomcat.redirect-context-root=false
server.max-http-request-header-size=8KB
server.tomcat.max-http-form-post-size=8KB
server.tomcat.max-swallow-size=8KB
springdoc.api-docs.enabled=false
