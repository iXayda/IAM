spring.application.name=iam
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.table-name=iam_browser_session
server.forward-headers-strategy=NONE
server.tomcat.remoteip.host-header=
server.tomcat.remoteip.port-header=
server.tomcat.redirect-context-root=false
server.max-http-request-header-size=8KB
server.tomcat.max-http-form-post-size=8KB
server.tomcat.max-swallow-size=8KB
springdoc.api-docs.enabled=false
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
management.endpoints.jmx.exposure.exclude=*
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,identityReadiness
